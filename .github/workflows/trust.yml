name: Trust

on:
  pull_request:
  push:
    branches: [main, master, devel]

permissions:
  contents: read

concurrency:
  group: trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust:
    name: Evidencia observacional
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TRUST_OUT_DIR: artifacts/trust
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Gerar manifest
        id: manifest
        continue-on-error: true
        run: bash ./scripts/bash/security/generate-manifest.sh "$TRUST_OUT_DIR"

      - name: Verificar manifest
        id: verify
        continue-on-error: true
        run: bash ./scripts/bash/security/verify-manifest.sh "$TRUST_OUT_DIR/MANIFEST.sha256"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        # Sem 'version' explícito: a action lê packageManager do package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Audit Node
        id: audit
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

      - name: Resumo de confianca
        if: always()
        run: |
          {
            echo "## Trust - evidencia observacional"
            echo ""
            echo "| Passo | Resultado |"
            echo "| --- | --- |"
            echo "| Gerar manifest | ${{ steps.manifest.outcome }} |"
            echo "| Verificar manifest | ${{ steps.verify.outcome }} |"
            echo "| pnpm audit | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trust-observational
          path: ${{ env.TRUST_OUT_DIR }}/
          if-no-files-found: warn
