name: Chromatic

# Nota (2026-09): `exitOnceUploaded` restaurado. Tinha sido removido para o
# job esperar pelo resultado real dos testes visuais em vez de sair logo
# após publicar (ver histórico deste ficheiro) — mas isso expôs que o
# Chromatic devolve "Your story couldn't be captured" (falha de
# captura/protocolo, não erro de componente) em 100% das stories, builds
# #36/#38/#71. Testada e refutada a hipótese de incompatibilidade com o
# Storybook 10.6.0 (downgrade para 10.4.1 não resolveu, PR #34). O
# Storybook publicado renderiza bem numa visita manual, então isto não é
# uma regressão de código — mas sem acesso aos logs completos (exigem
# login) não foi possível isolar a causa raiz sem continuar a gastar a
# quota gratuita do Chromatic à toa. Investigação registada em
# CHANGELOG.md; retomar com acesso ao dashboard ou ao suporte do Chromatic.

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Visual tests (Chromatic)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        # Sem 'version' explícito: a action lê packageManager do package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependências
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Publicar no Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: storybook:build
          exitOnceUploaded: true
          onlyChanged: true
