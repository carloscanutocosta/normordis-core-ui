name: Chromatic

# Nota (2026-09): removido `exitOnceUploaded` — antes, o job publicava o
# Storybook e saía sem esperar pelo resultado real dos 235 testes visuais
# (corriam depois, assincronamente, no servidor do Chromatic). Isso deu
# check verde num PR cujo build no Chromatic reportou "component errors" em
# todos os charts, sem que ninguém fosse notificado. Agora o job espera e
# falha se houver diffs/erros pendentes de revisão. Tier gratuito do
# Chromatic: só testa Chrome (Safari/Firefox exigiriam plano pago) — não
# cobre regressões específicas de outros motores de renderização.

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Visual tests (Chromatic)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        # Sem 'version' explícito: a action lê packageManager do package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependências
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Publicar no Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: storybook:build
          onlyChanged: true
